name: Build and Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Major version"
        required: true
        default: "0"
      minor:
        description: "Minor version"
        required: true
        default: "0"
  # push tags trigger removed to prevent recursive runs when creating tag

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0  # fetch all history for tagging

    - name: Get latest commit hash of main branch
      id: get_hash
      run: |
        git fetch origin main
        SHORT_SHA=$(git rev-parse --short origin/main)
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

    - name: Compute version
      id: version
      run: |
        MAJOR=${{ github.event.inputs.major }}
        MINOR=${{ github.event.inputs.minor }}
        HASH=${{ steps.get_hash.outputs.short_sha }}
        VERSION="v${MAJOR}.${MINOR}.${HASH}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Install Compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential mingw-w64

    - name: Setup Dependencies
      run: ./setup.sh windows

    - name: Build Windows
      run: make PLATFORM=windows

    - name: Package Windows
      run: zip -r fantasia-windows_x86_64.zip resources -j bin/*

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Create tag
      run: |
        git tag ${{ env.VERSION }}
        git push origin ${{ env.VERSION }}

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        files: |
          fantasia-windows_x86_64.zip
